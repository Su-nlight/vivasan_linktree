<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vivacious_San — Links</title>
<meta name="description" content="Portfolio, prints, and social links." />

<!-- Display + body + utility type pairing -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,500;1,9..144,600&family=Sora:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated aurora backdrop, purely decorative -->
  <div class="aurora" aria-hidden="true">
    <span class="blob blob--a"></span>
    <span class="blob blob--b"></span>
    <span class="blob blob--c"></span>
    <span class="blob blob--d"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <main class="page">

    <header class="profile" id="profile">
      <!-- Avatar + name + tagline are injected by script.js from the PROFILE object -->
    </header>

    <nav class="socials" id="socials" aria-label="Social links">
      <!-- Social icon pills injected by script.js from the SOCIALS array -->
    </nav>

    <section class="gem-stage" id="gemStage" aria-hidden="true">
      <div class="gem-tilt" id="gemTilt">
        <div class="gem">
          <span class="face face--front"></span>
          <span class="face face--back"></span>
          <span class="face face--right"></span>
          <span class="face face--left"></span>
          <span class="face face--top"></span>
          <span class="face face--bottom"></span>
        </div>
      </div>
    </section>

    <section class="links" id="links" aria-label="Links">
      <!-- Link cards injected by script.js from the LINKS array -->
    </section>

    <footer class="foot">
      <p class="eyebrow">Made with ❤️ by Async_sunlight</p>
    </footer>

  </main>

<script src="script.js"></script>
</body>
</html>
